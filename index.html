<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>健身间歇倒计时</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身倒计时">
<meta name="theme-color" content="#0f0f1a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f0f1a;
    color: #eee;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    max-width: 400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
    padding-top: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #e94560;
    text-align: center;
  }

  .card {
    width: 100%;
    background: #16213e;
    border-radius: 20px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .sets-card {
    padding: 20px;
    border-radius: 16px;
    background: #1a1a2e;
  }

  .time-display {
    font-size: 80px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(233,69,96,0.3);
    transition: color 0.3s, text-shadow 0.3s;
    line-height: 1;
  }
  .time-display.running {
    color: #00d2ff;
    text-shadow: 0 0 30px rgba(0,210,255,0.3);
  }
  .time-display.finished {
    color: #e94560;
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

  .time-set {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 14px;
  }
  .time-set label { font-size: 13px; color: #8892b0; margin-right: 4px; }
  .stepper {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .stepper input {
    width: 48px; text-align: center; font-size: 18px; font-weight: 600;
    padding: 8px 2px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    background: rgba(255,255,255,0.05); color: #eee; outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    -moz-appearance: textfield;
  }
  .stepper input:focus { border-color: #e94560; }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .step-btn {
    width: 32px; height: 32px; border-radius: 8px; padding: 0;
    font-size: 18px; font-weight: 700; line-height: 1;
    background: rgba(255,255,255,0.08); color: #8892b0;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .step-btn:hover { background: rgba(255,255,255,0.14); color: #eee; }
  .step-btn:active { transform: scale(0.9); }
  .time-set .colon { color: #8892b0; font-size: 20px; font-weight: 300; margin: 0 2px; }
  .stepper-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .unit-label { font-size: 12px; color: #8892b0; letter-spacing: 1px; }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    font-family: inherit; font-size: 17px; font-weight: 600; letter-spacing: 1px;
    border: none; border-radius: 14px; padding: 16px 40px; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.95); }
  .btn-start {
    background: linear-gradient(135deg, #00d2ff, #0090ff);
    color: #fff; box-shadow: 0 4px 20px rgba(0,144,255,0.3);
  }
  .btn-pause {
    background: linear-gradient(135deg, #f9a825, #ff8f00);
    color: #fff; box-shadow: 0 4px 20px rgba(255,143,0,0.3);
  }
  .btn-reset {
    background: rgba(255,255,255,0.08); color: #8892b0;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .sets-label { font-size: 13px; color: #8892b0; letter-spacing: 1px; margin-bottom: 8px; }
  .sets-count {
    font-size: 64px;
    font-weight: 200;
    color: #00d2ff;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow: 0 0 20px rgba(0,210,255,0.3);
  }
  .btn-clear {
    margin-top: 12px;
    font-size: 15px; padding: 10px 28px; border-radius: 10px;
    background: rgba(233,69,96,0.15); color: #e94560;
    border: 1px solid rgba(233,69,96,0.2);
  }
</style>
</head>
<body>

<div class="container">
  <h1>⏱ 健身间歇倒计时</h1>

  <div class="card">
    <div class="time-display" id="display">02:00</div>
    <div class="time-set">
      <label>设置：</label>
      <div class="stepper-group">
        <span class="unit-label">分</span>
        <div class="stepper">
          <button class="step-btn" onclick="adjust('inputMin',-1)">−</button>
          <input type="number" id="inputMin" min="0" max="99" value="2" inputmode="numeric">
          <button class="step-btn" onclick="adjust('inputMin',1)">+</button>
        </div>
      </div>
      <span class="colon">:</span>
      <div class="stepper-group">
        <span class="unit-label">秒</span>
        <div class="stepper">
          <button class="step-btn" onclick="adjust('inputSec',-5)">−</button>
          <input type="number" id="inputSec" min="0" max="59" value="0" inputmode="numeric">
          <button class="step-btn" onclick="adjust('inputSec',5)">+</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn-start" id="btnStart" onclick="toggleTimer()">开始</button>
      <button class="btn-reset" onclick="resetTimer()">重置</button>
    </div>
  </div>

  <div class="card sets-card">
    <div class="sets-label">已完成组数</div>
    <div class="sets-count" id="setsCount">0</div>
    <button class="btn-clear" onclick="clearSets()">清空</button>
  </div>
</div>

<script>
  let total = 120, remaining = 120, timer = null, running = false, sets = 0, paused = false, completed = false;
  let endTime = 0;
  let audioCtx = null;
  const INIT_MIN = 2, INIT_SEC = 0, INIT_TOTAL = 120;
  const display = document.getElementById('display');
  const btnStart = document.getElementById('btnStart');
  const setsCount = document.getElementById('setsCount');

  function adjust(id, delta) {
    const el = document.getElementById(id);
    const max = parseInt(el.max);
    const min = parseInt(el.min);
    let val = parseInt(el.value) || 0;
    val = Math.min(max, Math.max(min, val + delta));
    el.value = val;
    if (!running) {
      completed = false;
      total = readInputs();
      remaining = total;
      render();
    }
  }

  function fmt(s) {
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }
  function render() {
    display.textContent = fmt(remaining);
    display.className = 'time-display' + (running ? ' running' : (completed ? ' finished' : ''));
  }
  function readInputs() {
    const m = parseInt(document.getElementById('inputMin').value);
    const s = parseInt(document.getElementById('inputSec').value);
    const min = isNaN(m) ? 0 : Math.min(99, Math.max(0, m));
    const sec = isNaN(s) ? 0 : Math.min(59, Math.max(0, s));
    return min * 60 + sec || (isNaN(m) && isNaN(s) ? 120 : 0);
  }

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep() {
    try {
      const ctx = ensureAudio();
      [0, 200, 400].forEach(d => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.3;
        o.start(ctx.currentTime + d/1000); o.stop(ctx.currentTime + d/1000 + 0.15);
      });
    } catch(e) {}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  }

  function tick() {
    remaining--;
    render();
    if (remaining <= 0) {
      clearInterval(timer); timer = null; running = false; completed = true;
      remaining = 0;
      btnStart.textContent = '开始'; btnStart.className = 'btn-start';
      beep(); render(); return;
    }
  }

  function toggleTimer() {
    if (running) {
      clearInterval(timer); timer = null; running = false; paused = true;
      btnStart.textContent = '继续'; btnStart.className = 'btn-start';
    } else {
      if (remaining <= 0) { total = readInputs(); remaining = total; }
      if (!paused) { sets++; setsCount.textContent = sets; }
      paused = false;
      running = true;
      completed = false;
      endTime = Date.now() + remaining * 1000;
      ensureAudio();
      btnStart.textContent = '暂停'; btnStart.className = 'btn-pause';
      timer = setInterval(tick, 1000);
    }
    render();
  }

  function resetTimer() {
    clearInterval(timer); timer = null; running = false; paused = false; completed = false;
    document.getElementById('inputMin').value = INIT_MIN;
    document.getElementById('inputSec').value = INIT_SEC;
    total = INIT_TOTAL; remaining = INIT_TOTAL;
    sets = 0; setsCount.textContent = 0;
    btnStart.textContent = '开始'; btnStart.className = 'btn-start';
    render();
  }

  // 亮屏/切回时，用绝对时间校正（防后台暂停导致倒计时变慢）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      const realRemaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      const drift = remaining - realRemaining;
      if (drift > 0) {
        remaining = realRemaining;
        if (remaining <= 0) {
          clearInterval(timer); timer = null; running = false;
          remaining = 0;
          btnStart.textContent = '开始'; btnStart.className = 'btn-start';
          beep();
        }
        render();
      }
    }
  });

  function clearSets() { sets = 0; setsCount.textContent = 0; }

  render();
</script>
</body>
</html>
